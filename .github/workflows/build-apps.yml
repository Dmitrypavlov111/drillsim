name: Build DrillSim PRO (Offline Release APK & Windows EXE)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'icon-512.png'
      - '.github/workflows/build-apps.yml'

jobs:
  build-offline-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile static Tailwind CSS & strip external CDN/Fonts for 100% offline use
        run: |
          npm install -D tailwindcss@3.4.17
          cat <<'EOF' > tailwind.config.js
          module.exports = {
            content: ['./index.html'],
            theme: { extend: {} },
            plugins: [],
          }
          EOF
          cat <<'EOF' > input.css
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          npx tailwindcss -i input.css -o tailwind.static.css --minify
          python3 - <<'PYEOF'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('tailwind.static.css').read_text(encoding='utf-8')
          html = html.replace('<script src="https://cdn.tailwindcss.com/3.4.17"></script>', f'<style>{css}</style>', 1)
          html = html.replace('<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">', '')
          Path('index.offline.html').write_text(html, encoding='utf-8')
          print('Offline HTML size:', len(html))
          PYEOF

      - name: Upload offline HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-html-bundle
          path: index.offline.html

  build-android-apk:
    needs: build-offline-bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download offline HTML
        uses: actions/download-artifact@v4
        with:
          name: offline-html-bundle

      - name: Setup Node.js 22 & Java 17
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Capacitor Android project with custom icon & Target SDK 35
        run: |
          mkdir -p www
          cp index.offline.html www/index.html
          cat <<'EOF' > package.json
          {
            "name": "drillsim-pro-android",
            "version": "1.0.1",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "ru.drillsim.pro",
            "appName": "DrillSim PRO",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android

          # Replace default Capacitor icons safely (skip mipmap-anydpi-v26 to avoid XML/PNG duplicate resource error)
          if [ -f "icon-512.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                cp icon-512.png "$dir/ic_launcher.png"
                cp icon-512.png "$dir/ic_launcher_round.png"
                cp icon-512.png "$dir/ic_launcher_foreground.png"
              fi
            done
            mkdir -p android/app/src/main/res/drawable
            cp icon-512.png android/app/src/main/res/drawable/splash.png
          fi

          # Ensure Android SDK 35 is installed if available and harden AndroidManifest / build.gradle
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          fi

          python3 - <<'PYEOF'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          mtxt = manifest.read_text(encoding='utf-8')
          mtxt = mtxt.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          manifest.write_text(mtxt, encoding='utf-8')

          vg = Path('android/variables.gradle')
          if vg.exists():
              vtxt = vg.read_text(encoding='utf-8')
              vtxt = vtxt.replace('compileSdkVersion = 34', 'compileSdkVersion = 35').replace('targetSdkVersion = 34', 'targetSdkVersion = 35')
              vg.write_text(vtxt, encoding='utf-8')

          bg = Path('android/app/build.gradle')
          btxt = bg.read_text(encoding='utf-8')
          btxt = btxt.replace('versionCode 1', 'versionCode 2').replace('versionName "1.0"', 'versionName "1.0.1"')
          bg.write_text(btxt, encoding='utf-8')
          PYEOF

      - name: Build Signed Release APK (if keystore secret set) or Debug APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../DrillSim_PRO.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../DrillSim_PRO.apk
          fi

      - name: Upload DrillSim_PRO.apk
        uses: actions/upload-artifact@v4
        with:
          name: DrillSim_PRO_Android_APK
          path: DrillSim_PRO.apk

  build-windows-exe:
    needs: build-offline-bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download offline HTML
        uses: actions/download-artifact@v4
        with:
          name: offline-html-bundle

      - name: Setup Python 3.11 & build EXE
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pywebview pyinstaller
      - shell: pwsh
        run: |
          Copy-Item index.offline.html index.html -Force
          @'
          import os, sys, webview

          def resource_path(rel_path):
              base = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
              return os.path.join(base, rel_path)

          if __name__ == '__main__':
              html_file = resource_path('index.html')
              webview.create_window(
                  'DrillSim PRO — Тренажер СВП NOV Varco TDS-11SA',
                  url='file:///' + html_file.replace('\\', '/'),
                  width=1360,
                  height=860,
                  min_size=(960, 640),
              )
              webview.start(private_mode=False)
          '@ | Set-Content -Encoding UTF8 drillsim_desktop.py
          pyinstaller --noconfirm --onefile --windowed --name "DrillSim_PRO" --add-data "index.html;." drillsim_desktop.py

      - name: Upload DrillSim_PRO.exe
        uses: actions/upload-artifact@v4
        with:
          name: DrillSim_PRO_Windows_EXE
          path: dist/DrillSim_PRO.exe
