name: Build DrillSim PRO (Android APK & Windows EXE)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - '.github/workflows/build-apps.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Capacitor project & www/index.html
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat <<'EOF' > package.json
          {
            "name": "drillsim-pro-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          cat <<'EOF' > capacitor.config.json
          {
            "appId": "ru.drillsim.pro",
            "appName": "DrillSim PRO",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../DrillSim_PRO.apk

      - name: Upload DrillSim_PRO.apk
        uses: actions/upload-artifact@v4
        with:
          name: DrillSim_PRO_Android_APK
          path: DrillSim_PRO.apk

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pywebview & PyInstaller
        run: pip install pywebview pyinstaller

      - name: Build Windows EXE
        shell: pwsh
        run: |
          @'
          import os, sys, webview

          def resource_path(rel_path):
              base = getattr(sys, '_MEIPASS', os.path.dirname(os.path.abspath(__file__)))
              return os.path.join(base, rel_path)

          if __name__ == '__main__':
              html_file = resource_path('index.html')
              webview.create_window(
                  'DrillSim PRO — Тренажер СВП NOV Varco TDS-11SA',
                  url='file:///' + html_file.replace('\\', '/'),
                  width=1360,
                  height=860,
                  min_size=(960, 640),
              )
              webview.start(private_mode=False)
          '@ | Set-Content -Encoding UTF8 drillsim_desktop.py
          pyinstaller --noconfirm --onefile --windowed --name "DrillSim_PRO" --add-data "index.html;." drillsim_desktop.py

      - name: Upload DrillSim_PRO.exe
        uses: actions/upload-artifact@v4
        with:
          name: DrillSim_PRO_Windows_EXE
          path: dist/DrillSim_PRO.exe
